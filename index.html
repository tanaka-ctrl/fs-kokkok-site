<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株式会社KOKKOK｜店舗・オフィス什器、オーダー家具の設計・製作（横浜）</title>
<meta name="description" content="株式会社KOKKOKは横浜市港北区の木工所です。店舗・オフィス什器、オーダー家具の設計から製作・納品までを一貫して行います。">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="./" aria-label="株式会社KOKKOK"><span class="wordmark">KOKKOK</span></a>
  <nav class="site-nav">
    <a href="./" aria-current="page">HOME</a>
    <a href="about/">会社概要</a>
    <a href="contact/">お問い合わせ</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">FURNITURE / FIXTURES — YOKOHAMA</p>
      <h1>店舗・オフィス什器、家具の設計から納品まで。</h1>
      <p class="lead">設計事務所・施工会社・店舗オーナーの皆さまと、図面の段階から一緒に考え、横浜の工房で製作し、現場へお届けします。</p>
      <a class="btn btn-primary" href="contact/">お問い合わせ</a>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">WORKS</p>
      <div class="works-grid">
        <article class="work">
          <figure>
            <img src="images/work-sunnyhills-ginza-six.jpg" alt="SunnyHills GINZA SIX 店舗什器" loading="lazy">
            <figcaption>SunnyHills GINZA SIX 店舗什器<small>design: SAND / 2021</small></figcaption>
          </figure>
        </article>
        <article class="work">
          <figure>
            <img src="images/work-ohagi3.jpg" alt="ohagi3 ランプシェード" loading="lazy">
            <figcaption>ohagi3 ランプシェード<small>design: カミヤアーキテクツ / 2022</small></figcaption>
          </figure>
        </article>
        <article class="work">
          <figure>
            <img src="images/work-tsuki-to-umi.jpg" alt="月と海 家具" loading="lazy">
            <figcaption>月と海 家具<small>design: オンデザインパートナーズ / 2020</small></figcaption>
          </figure>
        </article>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">CONTACT</p>
      <h2>什器・家具のご相談</h2>
      <p class="lead">新規出店、改装、家具単品の製作など、お気軽にご相談ください。</p>
      <a class="btn" href="contact/">お問い合わせ</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="inner">
